<text x="1124" y="636" class="legend">min rate</text>
<text x="660.0" y="676" text-anchor="middle" class="small">Core mechanism: kNN uses weak_train as reference. If weak_train is almost all weak-correct, every neighborhood becomes almost all correct.</text>
<text x="660.0" y="704" text-anchor="middle" class="small">Dream weak_train acc = 0.863, so there are enough wrong reference points. SciQ/PAWS weak_train acc = 1.000/0.995, so kNN saturates.</text>
</svg>