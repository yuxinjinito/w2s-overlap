<text x="497.0" y="648.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#202020">Takeaway: answer count matters, but PAWS shows binary tasks do not automatically become highly skewed.</text>
